spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  application:
    name: qilu
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:qilu}?useUnicode=true&characterEncoding=utf8&serverTimezone=${MYSQL_SERVER_TIMEZONE:Asia/Singapore}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.marmot.qilu.common.event.like,com.marmot.qilu.common.event.comment,com.marmot.qilu.common.event.reply,com.marmot.qilu.common.event.search,com.marmot.qilu.common.event.voucher"
    listener:
      ack-mode: manual
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 10s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:qilu-jwt-secret-please-change-in-production-2026-0414-1233}
  expire: ${JWT_EXPIRE:36000000}

logging:
  level:
    root: info
    com.marmot.qilu: debug

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost/media}
  access-key: ${MINIO_ACCESS_KEY:qilu-minio}
  secret-key: ${MINIO_SECRET_KEY:qilu-minio}
  bucket: ${MINIO_BUCKET:qilu-media}
  max-file-size: 10485760
  post-image-prefix: post-image

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 官方 SDK 不提供 Spring Boot 自动配置，由 MilvusConfig 创建客户端。
# 启用后同时创建向量索引消费者，混合搜索会使用语义召回。
milvus:
  # 当前混合检索分支默认启用；只运行 ES 时设置 MILVUS_ENABLED=false。
  enabled: ${MILVUS_ENABLED:true}
  uri: ${MILVUS_URI:http://localhost:19530}
  token: "${MILVUS_TOKEN:}"
  database-name: ${MILVUS_DATABASE_NAME:default}
  connect-timeout: ${MILVUS_CONNECT_TIMEOUT:5s}
  rpc-deadline: ${MILVUS_RPC_DEADLINE:10s}
  # 首次向量索引或查询时自动创建；更换模型或维度时请使用新集合并回填。
  collection-name: ${MILVUS_COLLECTION_NAME:qilu_post_vector}

embedding:
  base-url: ${EMBEDDING_BASE_URL:http://192.168.1.11:11434}
  model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
  dimension: ${EMBEDDING_DIMENSION:1024}
  connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:3s}
  read-timeout: ${EMBEDDING_READ_TIMEOUT:30s}

# 单轮 RAG 生成；默认复用 Embedding 的 Ollama 地址，独立配置生成模型。
ollama:
  chat:
    base-url: ${OLLAMA_CHAT_BASE_URL:${embedding.base-url}}
    model: ${OLLAMA_CHAT_MODEL:qwen3.5:4b}
    connect-timeout: ${OLLAMA_CHAT_CONNECT_TIMEOUT:3s}
    read-timeout: ${OLLAMA_CHAT_READ_TIMEOUT:120s}
