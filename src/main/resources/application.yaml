spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  application:
    name: qilu
  datasource:
    url: jdbc:mysql://localhost:3306/qilu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Singapore
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.marmot.qilu.common.event.like,com.marmot.qilu.common.event.comment,com.marmot.qilu.common.event.reply,com.marmot.qilu.common.event.search,com.marmot.qilu.common.event.voucher"
    listener:
      ack-mode: manual
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 3s
    socket-timeout: 10s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:qilu-jwt-secret-please-change-in-production-2026-0414-1233}
  expire: ${JWT_EXPIRE:36000000}

logging:
  level:
    root: info
    com.marmot.qilu: debug

storage:
  endpoint: http://localhost:9000
  public-endpoint: http://localhost:9000
  access-key: qilu-minio
  secret-key: qilu-minio
  bucket: qilu-media
  max-file-size: 10485760
  post-image-prefix: post-image
  avatar-prefix: avatar

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs