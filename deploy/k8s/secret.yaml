apiVersion: v1
kind: Secret
metadata:
  name: qilu-secret
  namespace: qilu
type: Opaque
# 学习阶段使用 stringData 方便阅读和修改；
# K8s 会在保存时自动转成 base64 的 data。
# 这些值不要用于真实生产环境。
stringData:
  MYSQL_USERNAME: "root"
  MYSQL_PASSWORD: "root"
  JWT_SECRET: "qilu-jwt-secret-please-change-in-production-2026-0414-1233"
  JWT_EXPIRE: "36000000"
  MINIO_ACCESS_KEY: "qilu-minio"
  MINIO_SECRET_KEY: "qilu-minio"
