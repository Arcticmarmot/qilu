services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: qilu-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: qilu-minio
      MINIO_ROOT_PASSWORD: qilu-minio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

    restart: unless-stopped

volumes:
  minio-data: