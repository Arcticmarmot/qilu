events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # -----------------------------
    # 基础限流配置
    # -----------------------------
    #
    # $binary_remote_addr:
    # 按客户端 IP 限流，比 $remote_addr 更省内存。
    #
    # zone=api_limit:10m:
    # 创建一个 10MB 的共享内存区域保存限流状态。
    #
    # rate=20r/s:
    # 每个 IP 平均每秒允许 20 个请求。
    #
    # 说明：
    # nginx 层限流命中后，请求不会进入 Spring Boot。
    # 所以这里返回的是 HTTP 429，不走 qilu 的 ApiResponse。
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=seckill_limit:10m rate=10r/s;

    # 限流触发时返回 429 Too Many Requests。
    limit_req_status 429;

    # -----------------------------
    # 上游服务定义
    # -----------------------------

    # Spring Boot 后端服务。
    # 当前假设 qilu 后端运行在宿主机 8080 端口。
    upstream qilu_server {
        server host.docker.internal:8080;
        keepalive 32;
    }

    # MinIO 对象存储服务。
    # 当前假设 MinIO API 运行在宿主机 9000 端口。
    upstream qilu_minio {
        server host.docker.internal:9000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # -----------------------------
        # 健康检查
        # -----------------------------
        #
        # 用来快速确认 nginx 是否启动成功。
        # curl http://localhost/nginx-health
        location = /nginx-health {
            return 200 "qilu nginx is running\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------
        # 登录接口限流
        # -----------------------------
        #
        # 前端访问：
        # POST /api/auth/login
        #
        # 实际转发到：
        # POST http://localhost:8080/auth/login
        #
        # 登录接口容易被暴力尝试，所以单独使用更严格的限流：
        # 每 IP 每分钟 5 次，允许短暂 burst 5。
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://qilu_server/auth/login;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------
        # 秒杀相关接口限流
        # -----------------------------
        #
        # 前端访问：
        # /api/voucher-seckills/...
        #
        # 实际转发到：
        # http://localhost:8080/voucher-seckills/...
        #
        # 秒杀接口流量突刺明显，所以在 nginx 层先做基础 IP 限流。
        # 注意：这不是最终防刷方案，只是网关层第一道削峰。
        location /api/voucher-seckills/ {
            limit_req zone=seckill_limit burst=20 nodelay;

            proxy_pass http://qilu_server/voucher-seckills/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------
        # 通用 API 反向代理
        # -----------------------------
        #
        # 前端访问：
        # /api/posts
        # /api/comments
        # /api/users/me
        #
        # 实际转发到：
        # http://localhost:8080/posts
        # http://localhost:8080/comments
        # http://localhost:8080/users/me
        #
        # proxy_pass 末尾带 /，会把 /api/ 前缀去掉。
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://qilu_server/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / 长连接接口会需要更长的读取时间。
            # 普通 API 不受影响。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -----------------------------
        # MinIO 媒体资源代理
        # -----------------------------
        #
        # 前端访问：
        # /media/posts/xxx.jpg
        #
        # 实际转发到：
        # http://localhost:9000/qilu-media/posts/xxx.jpg
        #
        # 前提：
        # qilu-media bucket 已经允许匿名 download。
        location /media/ {
            proxy_pass http://qilu_minio/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            expires 10m;
        }
    }
}