events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=seckill_order_limit:10m rate=10r/s;

    limit_req_status 429;

    # Spring Boot 后端服务。
    upstream qilu_server {
        server host.docker.internal:8080;
        keepalive 32;
    }

    # MinIO 对象存储服务。
    upstream qilu_minio {
        server host.docker.internal:9000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # curl http://localhost/nginx-health
        location = /nginx-health {
            return 200 "qilu nginx is running\n";
            add_header Content-Type text/plain;
        }

        # 登录接口限流
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://qilu_server/auth/login;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 秒杀相关接口限流
        location ~ ^/api/voucher-seckills/[0-9]+/orders$ {
            limit_req zone=seckill_order_limit burst=20 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://qilu_server;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 通用 API 反向代理
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://qilu_server/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / 长连接接口会需要更长的读取时间。
            # 普通 API 不受影响。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # MinIO 媒体资源代理
        location /media/ {
            proxy_pass http://qilu_minio/qilu-media/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            expires 10m;
        }
    }
}